# OrbStack:  HOST_PORT=7601 docker compose --env-file ~/Development/.env up --build -d   ->  http://127.0.0.1:7601
# Real-mode settings (APD_REAL_*, AWS_*) are interpolated from the SHARED settings file (~/Development/.env, the owner rule: no per-app .env).
# The server binds 0.0.0.0 INSIDE the container (APD_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7601-7649.
name: agentcore-pingone-demo-lab

services:
  agentcore-pingone-demo-lab:
    container_name: agentcore-pingone
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7601}:7601"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "7601"
      APD_BIND: 0.0.0.0
      APD_MODE: mock
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-agentcore-pingone.local.ping-devops.com}
      # Real engine (owner-set in .env, never committed): APD_REAL_ENGINE=1, AWS creds, APD_REAL_WORKLOAD_NAME, APD_REAL_PROVIDER_NAME
      APD_REAL_ENGINE: ${APD_REAL_ENGINE:-0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      APD_REAL_WORKLOAD_NAME: ${APD_REAL_WORKLOAD_NAME:-}
      APD_REAL_PROVIDER_NAME: ${APD_REAL_PROVIDER_NAME:-}
      APD_REAL_RETURN_URL: ${APD_REAL_RETURN_URL:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7601/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
